name: Reference maintenance
on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  references:
    if: github.repository == 'Spartronics4915/Chiron'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.11.28
      - run: uv sync --frozen --group docs
      - run: uv run python tools/check_external_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-reference-report
          path: _build/reports/external-links.txt
